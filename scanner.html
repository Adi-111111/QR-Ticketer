<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Imperial Indian Society • Ticket Scanner</title>
  <style>
    :root{
      --navy:#081433; --navy2:#0d1c44; --ink:#f4f7ff; --muted:#b8c3de;
      --gold:#d4b16a; --gold2:#9c7e45; --ok:#16c782; --dup:#ffd166; --err:#ff6b6b;
      --border:rgba(255,255,255,.12); --glass:rgba(10,20,50,.55);
      --r:18px; --shadow:0 18px 60px rgba(0,0,0,.45);
      --vhpx:100svh; --safe-bottom:0px; --kb-offset:0px;
    }
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%; background:var(--navy); color:var(--ink); font:500 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    html { -webkit-text-size-adjust: 100%; }
    body{overflow:hidden}
    .app{min-height:100dvh; height:var(--vhpx, 100svh); width:100%;
      display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden;
      background:
        radial-gradient(1200px 600px at 110% -10%, rgba(212,177,106,.14), transparent 60%),
        radial-gradient(1000px 500px at -10% 110%, rgba(156,126,69,.10), transparent 60%);
    }
    .app, .stage, .viewer { min-height:0; min-width:0; }
    ::-webkit-scrollbar{display:none}

    header{
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg, rgba(13,28,68,.92), rgba(13,28,68,.62));
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .brand{display:flex; align-items:center; gap:10px; min-width:0}
    .logo{width:38px; height:38px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:#0d1a33; display:grid; place-items:center; flex:0 0 auto}
    .logo img{width:100%; height:100%; object-fit:cover}
    h1{font-size:16px; line-height:1.1}
    .muted{color:var(--muted); font-size:12px}
    .grow{flex:1 1 auto; min-width:0}
    .field{
      display:flex; align-items:center; gap:6px;
      background:rgba(255,255,255,.06); border:1px solid var(--border);
      border-radius:12px; padding:4px 10px; flex:1 1 220px; min-width:180px;
    }
    .field label{font-size:12px; color:var(--muted); white-space:nowrap}
    .field input{background:transparent; border:none; outline:none; color:var(--ink); font:inherit; width:100%; min-width:0}
    .btn{
      appearance:none; border:1px solid transparent;
      background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#0b0f1f;
      padding:10px 14px; border-radius:12px; font-weight:900; cursor:pointer; box-shadow:var(--shadow); flex:0 0 auto
    }
    .btn.secondary{background:rgba(255,255,255,.08); color:var(--ink); border:1px solid var(--border)}
    .btn.big{padding:14px 18px; font-size:18px; border-radius:14px}
    .btn.ok{background:linear-gradient(135deg,#0aa369,#1dd19b); color:#06120d}

    .stage{padding:10px; display:grid; grid-template-rows:auto minmax(0,1fr); gap:8px; overflow:hidden}
    .toolbar{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
    .tools{display:flex; gap:8px; flex-wrap:wrap}

    .viewer{position:relative; border:1px solid var(--border); border-radius:var(--r);
      overflow:hidden; background:#000; box-shadow:var(--shadow); height:100%; width:100%;}
    video{display:block; width:100%; height:100%; object-fit:contain; background:#000}
    #canvas{display:none}
    #overlay{position:absolute; inset:0; pointer-events:none; transform-origin:top left}

    footer{
      padding: 6px 10px max(6px, env(safe-area-inset-bottom), var(--safe-bottom));
      border-top:1px solid var(--border);
      background:linear-gradient(0deg, rgba(13,28,68,.92), rgba(13,28,68,.62));
    }
    .status{display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap}
    .pill{display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; font-weight:900}
    .pill.ok{background:rgba(22,199,130,.18); border:1px solid rgba(22,199,130,.5); color:#c9ffe8}
    .pill.dup{background:rgba(255,204,102,.18); border:1px solid rgba(255,204,102,.5); color:#fff0c6}
    .pill.err{background:rgba(255,107,107,.18); border:1px solid rgba(255,107,107,.5); color:#ffd7d7}

    /* Manual row */
    .manual{display:flex;align-items:center;gap:8px;flex:1 1 auto;flex-wrap:nowrap;min-width:0}
    .manual input{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:8px 10px;color:var(--ink);flex:1 1 auto;min-width:120px;font-size:16px;line-height:1.3}
    .manual .btn{flex:0 0 auto;white-space:nowrap;padding:8px 12px}

    /* Modal result */
    .modal{position:absolute; inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; display:none; place-items:end center; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.35))}
    .modal.show{display:grid}
    .card{
      position:relative; width:100%; max-width:620px; margin:0 10px 10px;
      background:var(--glass); border:1px solid var(--border); border-radius:14px; padding:14px;
      backdrop-filter:blur(10px) saturate(120%); box-shadow:var(--shadow);
    }
    /* gold accent when student */
    .card.student::before{
      content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
      background:linear-gradient(180deg,var(--gold),var(--gold2));
      border-top-left-radius:14px; border-bottom-left-radius:14px;
    }

    .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .title{font-weight:900; letter-spacing:.3px}
    .title.ok{color:#c9ffe8}.title.dup{color:#fff0c6}.title.err{color:#ffd7d7}
    .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
    .chip{font-size:12px; color:var(--muted)}
    .badge{
      display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; font-weight:900; font-size:12px;
      background:rgba(255,255,255,.08); border:1px solid var(--border); color:var(--ink);
    }
    .badge.student{
      background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#0b0f1f; border-color:rgba(0,0,0,.2);
    }

    .info{color:var(--muted); font-size:13px; margin-top:6px}
    .next{margin-top:12px; display:flex; justify-content:flex-end}
    .next .btn{box-shadow:none}

    /* Bottom sheet input */
    .kbd-sheet{position:fixed; inset:0; display:none; background:rgba(0,0,0,.35); z-index:9999}
    .kbd-sheet.show{display:grid; place-items:end center}
    .kbd-card{width:100%; max-width:720px; margin:0 10px; background:rgba(13,28,68,.96); border:1px solid var(--border); border-radius:16px; padding:12px; box-shadow:var(--shadow); margin-bottom:calc(max(10px, env(safe-area-inset-bottom)) + var(--kb-offset)); display:grid; grid-template-columns:1fr auto; gap:8px}
    #kbdInput{background:rgba(255,255,255,.08); border:1px solid var(--border); border-radius:12px; padding:12px 12px; color:var(--ink); font-size:18px; line-height:1.3; width:100%}
    .kbd-actions{display:flex; gap:8px; align-items:center}.kbd-actions .btn{padding:10px 14px}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo"><img id="brandLogo" src="https://i.imgur.com/neni2cW.png" alt="" /></div>
        <div><h1>Ticket Scanner</h1><div class="muted" id="net">Network: checking…</div></div>
      </div>
      <div class="grow"></div>
      <div class="field"><label for="api">API</label><input id="api" value="https://&lt;192.168.0.231&gt;:8443/verify" spellcheck="false"/></div>
      <button class="btn" id="startBtn">Start</button>
    </header>

    <section class="stage">
      <div class="toolbar">
        <div class="tools">
          <label class="btn secondary" for="file">Take Photo</label>
          <input id="file" type="file" accept="image/*" capture="environment" style="display:none">
          <button class="btn secondary" id="torchBtn" title="Toggle flashlight">Torch</button>
          <button class="btn secondary" id="muteBtn" title="Sound">🔈</button>
        </div>
        <div class="tools"></div>
      </div>

      <div class="viewer" id="viewer">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <canvas id="overlay"></canvas>

        <div class="modal" id="modal">
          <div class="card" id="resultCard">
            <div class="row">
              <div class="title" id="mTitle">—</div>
              <div class="meta">
                <span class="chip" id="mWhen">—</span>
                <span class="badge student" id="studentBadge" style="display:none">🎓 Student</span>
              </div>
            </div>
            <div class="info" id="mInfo">—</div>
            <div class="next"><button class="btn big ok" id="nextBtn">Next ticket →</button></div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <div class="status">
        <span class="pill" id="pill">Ready</span>
        <div class="manual">
          <input id="manualId" type="text" placeholder="Enter Ticket ID (e.g., login-001)"
                 inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" />
          <button class="btn" id="manualBtn">Verify</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Bottom sheet -->
  <div id="kbdSheet" class="kbd-sheet" aria-hidden="true">
    <div class="kbd-card">
      <input id="kbdInput" type="text" placeholder="Enter Ticket ID (e.g., login-001)"
             inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" />
      <div class="kbd-actions">
        <button class="btn secondary" id="kbdCancel">Cancel</button>
        <button class="btn" id="kbdVerify">Verify</button>
      </div>
    </div>
  </div>

  <script src="/jsQR.js"></script>

  <script>
    function setViewportVars(){
      const vv = window.visualViewport;
      const h = vv ? vv.height : window.innerHeight;
      const top = vv ? vv.offsetTop : 0;
      const safeBottom = Math.max(0, (window.innerHeight - h - top));
      document.documentElement.style.setProperty('--vhpx', h + 'px');
      document.documentElement.style.setProperty('--safe-bottom', safeBottom + 'px');
    }
    (document.readyState === 'loading')
      ? document.addEventListener('DOMContentLoaded', setViewportVars, {once:true})
      : setViewportVars();
    window.addEventListener('resize', setViewportVars);
    window.addEventListener('orientationchange', setViewportVars);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setViewportVars);
      window.visualViewport.addEventListener('scroll', setViewportVars);
    }
  </script>

  <script>
    /* ---------- URL normaliser + resolver ---------- */
    function normaliseApiUrl(raw){
      let u = (raw || '').trim().replace(/[<>]/g, '');
      if (!u) return location.origin + '/verify';
      if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?$/.test(u)) u = 'http://' + u + '/verify';
      if (/^https?:\/\/[^/]+$/.test(u)) u = u + '/verify';
      u = u.replace(/\/+$/,'');
      if (!/\/verify$/.test(u)) u += '/verify';
      return u;
    }
    function getVerifyUrl(){
      const typed = document.getElementById('api').value;
      if (!typed) return location.origin + '/verify';
      return normaliseApiUrl(typed);
    }
    /* ---------------------------------------------- */

    // Elements
    const apiInput = document.getElementById('api');
    const startBtn = document.getElementById('startBtn');
    const torchBtn = document.getElementById('torchBtn');
    const muteBtn  = document.getElementById('muteBtn');
    const fileInput= document.getElementById('file');

    const viewer = document.getElementById('viewer');
    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d', { willReadFrequently: true });
    const overlay= document.getElementById('overlay');
    const octx   = overlay.getContext('2d');

    const pill   = document.getElementById('pill');

    const modal  = document.getElementById('modal');
    const mTitle = document.getElementById('mTitle');
    const mWhen  = document.getElementById('mWhen');
    const mInfo  = document.getElementById('mInfo');
    const nextBtn= document.getElementById('nextBtn');

    const resultCard   = document.getElementById('resultCard');
    const studentBadge = document.getElementById('studentBadge');

    const manualId  = document.getElementById('manualId');
    const manualBtn = document.getElementById('manualBtn');

    const kbdSheet  = document.getElementById('kbdSheet');
    const kbdInput  = document.getElementById('kbdInput');
    const kbdCancel = document.getElementById('kbdCancel');
    const kbdVerify = document.getElementById('kbdVerify');

    // State
    let stream=null, track=null, running=false, muted=false;
    let lastToken='', lastTime=0, verifyBusy=false, locked=false;

    const vibrate = p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
    const beep=(f=660,d=120,t='sine')=>{
      if(muted) return;
      try{
        const A=new (window.AudioContext||window.webkitAudioContext)();
        const o=A.createOscillator(), g=A.createGain();
        o.type=t; o.frequency.value=f; o.connect(g); g.connect(A.destination);
        g.gain.setValueAtTime(.001,A.currentTime);
        g.gain.linearRampToValueAtTime(.12,A.currentTime+.02);
        g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d/1000);
        o.start(); o.stop(A.currentTime+d/1000+.02);
      }catch(e){}
    };
    function setPill(kind,text){ pill.className='pill '+(kind||''); pill.textContent=text; }

    function drawBox(loc){ /* overlay disabled */ }

    async function start(){
      await stop(); locked=false; clearModal(); clearStudent(); setPill('', 'Point camera at QR…');
      try{
        const c = { video: { facingMode:'environment' } };
        stream = await navigator.mediaDevices.getUserMedia(c);
        track = stream.getVideoTracks()[0];
        video.srcObject = stream; await video.play();
        running=true; loop();
      }catch(e){ setPill('err','Camera blocked. Use Take Photo.'); }
    }

    async function stop(){ running=false; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

    async function toggleTorch(){
      try{
        if(!track) return;
        const caps=track.getCapabilities&&track.getCapabilities();
        if(caps&&("torch" in caps)){
          const on=!(track.getSettings&&track.getSettings().torch);
          await track.applyConstraints({advanced:[{torch:on}]});
        }
      }catch(e){}
    }

    function showModal(kind, title, info){
      locked=true; running=false;
      mTitle.textContent=title; mTitle.className='title '+(kind==='ok'?'ok':kind==='dup'?'dup':'err');
      mWhen.textContent=new Date().toLocaleTimeString();
      mInfo.innerHTML=info; modal.className='modal show';
    }
    function clearModal(){ modal.className='modal'; mInfo.textContent=''; }

    function showStudent(){ studentBadge.style.display='inline-flex'; resultCard.classList.add('student'); }
    function clearStudent(){ studentBadge.style.display='none'; resultCard.classList.remove('student'); }

    function isStudentFlag(v){
      return v === 1 || v === true || v === '1' || v === 'true' || v === 'Y';
    }

    function renderVerifyResponse(data){
      if(!data){
        setPill('err','Network error');
        showModal('err','Network error','Check API URL / connectivity.');
        clearStudent();
        return;
      }

      const student = data && data.payload ? isStudentFlag(data.payload.student) : false;
      if (student) showStudent(); else clearStudent();

      if(data.status === 'ok_first_entry' || data.status === 'ok_recent'){
        setPill('ok','OK • First Entry');
        showModal('ok','Valid ticket', (data?.payload?.email||'')+'<br/><small>'+(data?.payload?.ticket_id||'')+'</small>');
        beep(760,130,'triangle'); vibrate([25,25]);
      } else if(data.status === 'duplicate'){
        setPill('dup','Duplicate • Already used');
        const when = data.last_checkin ? new Date(data.last_checkin*1000).toLocaleString() : 'earlier';
        showModal('dup','Duplicate ticket','Used: '+when);
        beep(320,180,'square'); vibrate([60,40,60]);
      } else {
        const msg = data.message || 'Invalid / Error';
        setPill('err', msg);
        showModal('err','Invalid / Error', msg);
        beep(140,220,'sawtooth'); vibrate([120]);
      }
    }

    async function verify(token){
      if(verifyBusy||locked) return; verifyBusy=true; setPill('', 'Verifying…');
      try{
        const url = getVerifyUrl();
        const res = await fetch(url, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token, device_id:'phone' })
        });
        let data=null;
        try { data = await res.json(); }
        catch {
          const txt = await res.text().catch(()=> '');
          console.error('Non-JSON response from', url, res.status, txt.slice(0,200));
        }
        renderVerifyResponse(data);
      } catch(e){
        console.error('Fetch failed (verify):', e, 'URL=', getVerifyUrl());
        setPill('err','Network error'); showModal('err','Network error','Check API URL / connectivity.'); clearStudent();
      } finally { verifyBusy=false; }
    }

    async function manualVerify(tid){
      if(!tid) return;
      if(verifyBusy) return;
      verifyBusy=true; setPill('', 'Verifying…');
      try{
        const manualUrl  = getVerifyUrl().replace(/\/?verify\/?$/,'/manual_verify');
        const res = await fetch(manualUrl, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ ticket_id: tid })
        });
        let data=null;
        try { data = await res.json(); }
        catch {
          const txt = await res.text().catch(()=> '');
          console.error('Non-JSON response from', manualUrl, res.status, txt.slice(0,200));
        }
        renderVerifyResponse(data);
      } catch(e){
        console.error('Fetch failed (manual):', e, 'URL=', getVerifyUrl());
        setPill('err','Network error'); showModal('err','Network error','Check API URL / connectivity.'); clearStudent();
      } finally { verifyBusy=false; }
    }

    function loop(){
      if(!running||locked) return;
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(img.data,img.width,img.height);
        if(code&&code.data){
          const token=code.data.trim(); const now=Date.now();
          if(token!==lastToken || (now-lastTime)>1400){ lastToken=token; lastTime=now; verify(token); }
        }
      }
      requestAnimationFrame(loop);
    }

    // Photo fallback
    fileInput.addEventListener('change', e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const url=URL.createObjectURL(f); const img=new Image();
      img.onload=()=>{
        canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
        ctx.drawImage(img,0,0);
        const d=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=jsQR(d.data,d.width,d.height);
        if(code&&code.data){ verify(code.data.trim()); } else { setPill('err','No QR found'); }
        URL.revokeObjectURL(url);
      };
      img.onerror=()=>{ setPill('err','Could not read photo'); };
      img.src=url;
    },{passive:true});

    // Events
    startBtn.onclick = async ()=>{ await start(); await health(); };
    torchBtn.onclick = toggleTorch;
    muteBtn.onclick  = ()=>{ muted=!muted; muteBtn.textContent = muted ? '🔇' : '🔈'; };
    nextBtn.onclick  = ()=>{ clearModal(); clearStudent(); locked=false; running=true; loop(); setPill('', 'Ready for next'); };

    // Manual input bottom sheet (with lift)
    function updateKeyboardOffset(){
      const vv = window.visualViewport;
      if (!vv) return;
      const overlap = Math.max(0, (window.innerHeight - vv.height - vv.offsetTop));
      document.documentElement.style.setProperty('--kb-offset', overlap + 'px');
    }
    function bindKeyboardOffsetListeners(bind=true){
      if (!window.visualViewport) return;
      const vv = window.visualViewport;
      if (bind) {
        vv.addEventListener('resize', updateKeyboardOffset);
        vv.addEventListener('scroll', updateKeyboardOffset);
        updateKeyboardOffset();
      } else {
        vv.removeEventListener('resize', updateKeyboardOffset);
        vv.removeEventListener('scroll', updateKeyboardOffset);
        document.documentElement.style.setProperty('--kb-offset', '0px');
      }
    }
    function openKbdSheet(prefill=''){
      kbdInput.value = prefill || '';
      kbdSheet.classList.add('show');
      document.body.style.overflow = 'hidden';
      locked = true;
      bindKeyboardOffsetListeners(true);
      setTimeout(()=> { updateKeyboardOffset(); kbdInput.focus(); }, 50);
    }
    function closeKbdSheet(){
      kbdSheet.classList.remove('show');
      document.body.style.overflow = '';
      bindKeyboardOffsetListeners(false);
    }
    manualId.addEventListener('focus', (e) => { e.preventDefault(); manualId.blur(); openKbdSheet(manualId.value.trim()); });
    manualBtn.addEventListener('click', () => openKbdSheet(manualId.value.trim()));
    kbdCancel.addEventListener('click', closeKbdSheet);
    kbdVerify.addEventListener('click', () => {
      const val = kbdInput.value.trim();
      if (!val) { kbdInput.focus(); return; }
      manualId.value = val;
      closeKbdSheet();
      manualVerify(val);
    });
    kbdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') kbdVerify.click();
      if (e.key === 'Escape') kbdCancel.click();
    });
    kbdSheet.addEventListener('click', (e) => { if (e.target === kbdSheet) closeKbdSheet(); });

    async function health(){
      try{
        const healthUrl  = getVerifyUrl().replace(/\/?verify\/?$/,'/health');
        const r = await fetch(healthUrl,{cache:'no-store'});
        await r.json();
        document.getElementById('net').textContent='Network: OK';
      } catch(e){
        console.error('Health failed:', e, 'URL=', getVerifyUrl());
        document.getElementById('net').textContent='Network: check server URL';
      }
    }

    (function initApi(){ try{
      const here=location.origin;
      if(here.startsWith('http')) document.getElementById('api').value = here + '/verify';
    }catch(e){} })();
  </script>
</body>
</html>
